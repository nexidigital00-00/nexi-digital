<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12443f">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ortak/app.css?v=202610032036">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ortak/menu.js?v=202610032036"></script>
<title>ZLD | Garson</title>
<meta name="robots" content="noindex">
</head>
<body class="staff">
<div class="staff-top">
  <img src="logo.png" alt="" width="38" height="38">
  <h1>Garson</h1>
  <span class="live" id="live">Bağlanıyor</span>
  <a href="mutfak.html">Mutfak</a>
</div>
<p class="offline" id="offline">Sunucuya bağlanılamadı. İnternet bağlantısını kontrol edin. Siparişler gönderilene kadar bu telefonda bekler.</p>
<div class="wrap">
  <div class="alerts" id="alerts" aria-live="assertive"></div>
  <nav class="masalar" id="masalar" aria-label="Masa seçimi"></nav>
  <p class="legend" aria-label="Renklerin anlamı"><span class="stg-onay">Onay bekliyor</span><span class="stg-mutfak">Mutfakta</span><span class="stg-hazir">Hazır</span><span class="stg-servis">Servis edildi</span><span class="stg-odendi">Ödendi</span></p>
  <p class="garson-hint" id="hint">Sipariş almak için masayı seçin.</p>
  <div id="menuArea" hidden>
    <div class="bar" id="bar">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5d6d68" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Ürün ara: sarma, börek, trileçe…" aria-label="Ürün ara" autocomplete="off">
      </label>
      <nav class="chips" id="chips" aria-label="Kategoriler"></nav>
    </div>
    <main>
      <div id="cats"></div>
      <p class="empty" id="empty" hidden>Bu aramayla eşleşen ürün yok.</p>
    </main>
  </div>
</div>

<div class="cartbar" id="cartbar">
  <button type="button" id="openCart" aria-haspopup="dialog">
    <span class="count" id="cCount">0</span><span class="lbl" id="cLbl">Adisyon</span><span class="tot" id="cTot">0 TL</span>
  </button>
</div>
<div id="sheetWrap">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h">
    <div class="grip"></div>
    <button class="close" id="closeCart" aria-label="Kapat">×</button>
    <h2 id="sheet-h">Masa</h2>
    <div id="pendBox"></div>
    <div id="sentBox"></div>
    <div id="draftBox"></div>
    <div class="sum"><span>Masa toplamı</span><strong id="sTot">0 TL</strong></div>
    <div id="draftForm">
      <label for="inote">Mutfak için not (isteğe bağlı, içeceklere gerekmez)</label>
      <input id="inote" type="text" placeholder="Acısız, yanına ekstra yoğurt">
      <button class="btn-wa" id="send" type="button">Masaya ekle</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const STATUS_TR = {onay:"Onay bekliyor", yeni:"Mutfakta", hazirlaniyor:"Mutfakta", hazir:"Hazır", servis:"Servis edildi"};
// 5 renkli aşama: onay → mutfak → hazır → servis (ödeme bekliyor) → ödendi
const STAGE = i => i.paid ? "odendi" : i.status === "onay" ? "onay" : (i.status === "yeni" || i.status === "hazirlaniyor") ? "mutfak" : i.status;
const STAGE_TR = {onay:"Onay bekliyor", mutfak:"Mutfakta", hazir:"Hazır", servis:"Servis edildi", odendi:"Ödendi"};
const STAGE_ORDER = ["onay", "hazir", "mutfak", "servis", "odendi"];   // masa rengi: en çok ilgi isteyen aşama
const tableStage = o => { if(!o || !o.items.length) return ""; const set = new Set(o.items.map(STAGE)); return STAGE_ORDER.find(x => set.has(x)); };
let masa = store.get("zld_garson_masa", 0);
let drafts = store.get("zld_garson_drafts", {});     // {masa: {"key:j": qty}}
let openOrders = [];                                  // [{id, masa, items:[...]}]
let knownPending = null, knownReady = null;
let cart = {};

const view = MenuView({root:$("cats"), chips:$("chips"), search:$("q"), empty:$("empty"), mode:"order", cart,
  onChange(){ drafts[masa] = {...cart}; store.set("zld_garson_drafts", drafts); updateBar(); },
  onAdd(p, o){ toast(itemLabel(p.ad, o.l) + " eklendi"); }});

const orderOf = m => openOrders.find(o => o.masa === m);
const orderTotal = o => o ? o.items.reduce((a, i) => a + i.price * i.qty, 0) : 0;
const pendingOf = o => o ? o.items.filter(i => i.status === "onay") : [];
const whoIn = o => { const f = makeLabeler(o.masa, o.items); return i => f(i); };
const sentOf = o => o ? o.items.filter(i => i.status !== "onay") : [];
const readyOf = o => o ? o.items.filter(i => i.status === "hazir") : [];
let who = i => "Masa geneli";   // refresh'te masa masa yeniden kurulur

function renderMasalar(){
  let h = "";
  for(let i = 1; i <= ZLD.MASA_SAYISI; i++){
    const o = orderOf(i), pend = pendingOf(o).length, rdy = readyOf(o).length;
    const dolu = !!o || Object.keys(drafts[i] || {}).length > 0;
    const stg = tableStage(o);
    h += `<button type="button" data-m="${i}" class="${stg ? "stg-" + stg : dolu ? "dolu" : ""}" title="${stg ? STAGE_TR[stg] : ""}" aria-pressed="${i === masa}" aria-label="Masa ${i}${pend ? `, ${pend} ürün onay bekliyor` : ""}${rdy ? `, ${rdy} ürün hazır` : ""}${!pend && !rdy && dolu ? ", açık adisyon var" : ""}">${i}${pend ? `<span class="pend">${pend}</span>` : ""}${rdy ? `<span class="rdy">${rdy}</span>` : ""}</button>`;
  }
  $("masalar").innerHTML = h;
  // üstte bekleyen masalar uyarısı
  const ready = openOrders.filter(o => readyOf(o).length).sort((a, b) => a.masa - b.masa);
  const waiting = openOrders.filter(o => pendingOf(o).length).sort((a, b) => a.masa - b.masa);
  $("alerts").innerHTML = ready.map(o => `<button type="button" class="alert ready" data-open="${o.masa}"><b>Masa ${o.masa}: sipariş hazır</b><span>${readyOf(o).reduce((a, i) => a + i.qty, 0)} ürün mutfakta bekliyor. Servis edince dokunun.</span></button>`).join("") + waiting.map(o => {
    const P = pendingOf(o), w = whoIn(o), people = new Set(P.map(w)).size;  // kaç farklı telefon
    return `<button type="button" class="alert" data-open="${o.masa}"><b>Masa ${o.masa}: yeni sipariş</b><span>${people} kişi (${[...new Set(P.map(w))].sort((x, y) => x.localeCompare(y, "tr", {numeric:true})).join(", ")}), ${P.reduce((a, i) => a + i.qty, 0)} ürün onay bekliyor. Görmek için dokunun.</span></button>`;
  }).join("");
}
$("alerts").addEventListener("click", e => { const b = e.target.closest("[data-open]"); if(!b) return; selectMasa(+b.dataset.open); openSheet(); });
function selectMasa(m){
  masa = m; store.set("zld_garson_masa", m);
  for(const k in cart) delete cart[k];
  Object.assign(cart, drafts[m] || {});
  $("menuArea").hidden = !m;
  renderMasalar(); view.render(); updateBar(); updateHint();
}
function updateHint(){
  if(!masa){ $("hint").textContent = "Sipariş almak için masayı seçin."; return; }
  const o = orderOf(masa), S = sentOf(o);
  $("hint").textContent = o
    ? `Masa ${masa}: mutfakta ${S.reduce((a, i) => a + i.qty, 0)} ürün, toplam ${tl(orderTotal(o))}. Yeni ürün ekleyebilirsiniz.`
    : `Masa ${masa} boş. Müşterinin söylediklerini ekleyin.`;
}
$("masalar").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if(b) selectMasa(+b.dataset.m); });

function updateBar(){
  const L = cartLines(cart), n = L.reduce((a, l) => a + l.q, 0), t = L.reduce((a, l) => a + l.sum, 0);
  const o = orderOf(masa), pend = pendingOf(o).length;
  $("cCount").textContent = n || pend || 0;
  $("cLbl").textContent = n ? `Masa ${masa}: mutfağa gönder` : pend ? `Masa ${masa}: onay bekleyenler` : `Masa ${masa} adisyonu`;
  $("cTot").textContent = tl(t + orderTotal(o));
  $("cartbar").classList.toggle("show", !!masa && (n > 0 || !!o));
  return {L, n, t, o};
}

const wrap = $("sheetWrap"); let lastFocus = null;
function lineHTML(i, actions){
  return `<div class="line">
      <div class="n"><b>${i.qty} × ${esc(itemLabel(i.name, i.option))}</b><span>${esc(who(i))}${i.note ? ", " + esc(i.note) : ""}</span></div>
      ${actions}</div>`;
}
function renderSheet(){
  const {L, t, o} = updateBar();
  if(!L.length && !o){ closeSheet(); return; }
  $("sheet-h").textContent = "Masa " + masa;
  who = o ? whoIn(o) : (i => "Masa geneli");
  const P = pendingOf(o);
  $("pendBox").innerHTML = P.length ? `<div class="pend-box"><h3>Müşteriler QR'dan gönderdi</h3>` +
    P.map(i => lineHTML(i, `<span class="p">${tl(i.price * i.qty)}</span><button class="x" data-del="${i.id}" aria-label="${esc(i.name)} siparişini sil">×</button>`)).join("") +
    `<button class="btn-wa" type="button" id="approve">${P.every(i => noKitchen(i.product_key)) ? "Onayla" : "Hepsini mutfağa gönder"} (${P.reduce((a, i) => a + i.qty, 0)} ürün)</button>` +
    (P.some(i => noKitchen(i.product_key)) ? `<p class="dep" style="margin:8px 0 0">İçecekler mutfağa gitmez, onaylayınca size "Hazır" olarak düşer.</p>` : "") + `</div>` : "";
  const S = sentOf(o);
  const R = readyOf(o);
  $("sentBox").innerHTML = (R.length ? `<div class="ready-box"><h3>Hazır, servis bekliyor</h3>` + R.map(i => lineHTML(i, "")).join("") +
      `<button class="btn-wa" type="button" id="serveAll">Servis ettim (${R.reduce((a, i) => a + i.qty, 0)} ürün)</button></div>` : "") +
    (S.filter(i => i.status !== "hazir").length ? `<h3>Mutfakta ve servis edilenler</h3>` + S.filter(i => i.status !== "hazir").map(i => lineHTML(i,
      `<span class="st stg-${STAGE(i)}">${STAGE_TR[STAGE(i)]}</span>`)).join("") : "");
  $("draftBox").innerHTML = L.length ? `<h3>Masa geneline eklenecek</h3>` + L.map(l => `<div class="line">
      <div class="n"><b>${esc(l.p.ad)}</b><span>${l.o.l ? esc(l.o.l) + ", " : ""}${tl(l.o.p)}</span></div>
      <div class="qty light"><button data-l="${l.k}" data-d="-1" aria-label="Bir azalt">−</button><span>${l.q}</span><button data-l="${l.k}" data-d="1" aria-label="Bir artır">+</button></div>
      <div class="p">${tl(l.sum)}</div></div>`).join("") : "";
  $("draftForm").hidden = !L.length;
  $("sTot").textContent = tl(t + orderTotal(o));
}
function openSheet(){ lastFocus = document.activeElement; renderSheet(); wrap.classList.add("open"); $("closeCart").focus(); }
function closeSheet(){ wrap.classList.remove("open"); view.render(); updateBar(); if(lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
$("openCart").onclick = openSheet; $("closeCart").onclick = closeSheet; $("sheetBg").onclick = closeSheet;
addEventListener("keydown", e => { if(e.key === "Escape" && wrap.classList.contains("open")) closeSheet(); });
$("draftBox").addEventListener("click", e => {
  const b = e.target.closest("[data-l]"); if(!b) return;
  cart[b.dataset.l] = (cart[b.dataset.l] || 0) + (+b.dataset.d);
  if(cart[b.dataset.l] <= 0) delete cart[b.dataset.l];
  drafts[masa] = {...cart}; store.set("zld_garson_drafts", drafts); renderSheet();
});
$("sentBox").addEventListener("click", async e => {
  const b = e.target.closest("#serveAll"); if(!b) return;
  b.disabled = true; b.textContent = "Kaydediliyor…";
  const o = orderOf(masa);
  const {error} = await db.from("order_items").update({status:"servis"}).eq("order_id", o.id).eq("status", "hazir");
  if(error){ toast("Kaydedilemedi, tekrar deneyin"); b.disabled = false; return; }
  toast(`Masa ${masa} servis edildi`);
  await refresh();
});
$("pendBox").addEventListener("click", async e => {
  const del = e.target.closest("[data-del]");
  if(del){
    if(!confirm("Bu ürün siparişten silinsin mi?")) return;
    del.disabled = true;
    const {error} = await db.from("order_items").delete().eq("id", del.dataset.del).eq("status", "onay");
    if(error){ toast("Silinemedi, tekrar deneyin"); del.disabled = false; return; }
    await refresh(); return;
  }
  if(e.target.closest("#approve")){
    const b = $("approve"); b.disabled = true; b.textContent = "Gönderiliyor…";
    const o = orderOf(masa);
    // yemekler mutfağa, içecekler doğrudan "hazır" (garson getirir)
    const P = pendingOf(o), drink = P.filter(i => noKitchen(i.product_key)).map(i => i.id), food = P.filter(i => !noKitchen(i.product_key)).map(i => i.id);
    const res = await Promise.all([
      food.length ? db.from("order_items").update({status:"yeni"}).in("id", food).eq("status", "onay") : {},
      drink.length ? db.from("order_items").update({status:"hazir"}).in("id", drink).eq("status", "onay") : {}]);
    if(res.some(r => r.error)){ toast("Gönderilemedi, tekrar deneyin"); b.disabled = false; return; }
    toast(food.length ? `Masa ${masa} yemekleri mutfağa gitti` : `Masa ${masa} onaylandı`);
    await refresh();
  }
});

$("send").onclick = async () => {
  const L = cartLines(cart); if(!L.length) return;
  if(!db){ toast("Sunucu bağlantısı yok"); return; }
  const btn = $("send"); btn.disabled = true; btn.textContent = "Gönderiliyor…";
  try{
    await addTableItems(masa, L, {note: $("inote").value.trim() || null});
    for(const k in cart) delete cart[k];
    delete drafts[masa]; store.set("zld_garson_drafts", drafts);
    $("inote").value = "";
    await refresh();
    toast(L.some(l => !noKitchen(l.key)) ? `Masa ${masa}: yemekler mutfağa gitti` : `Masa ${masa} hesabına eklendi`);
    closeSheet();
  }catch(ex){
    console.error(ex);
    toast("Gönderilemedi. İnterneti kontrol edip tekrar basın.");
  }finally{ btn.disabled = false; btn.textContent = "Masaya ekle"; }
};

/* yeni QR siparişi gelince ses + titreşim */
let audioOk = false;
addEventListener("pointerdown", () => { audioOk = true; }, {once:true});
function ding(){
  if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
  if(!audioOk) return;
  try{ const c = new (window.AudioContext || window.webkitAudioContext)();
    [0, .22].forEach(d => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 988; o.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(.25, c.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + d + .18); o.start(c.currentTime + d); o.stop(c.currentTime + d + .2); });
  }catch(e){}
}

async function refresh(){
  if(!db) return;
  const {data, error} = await db.from("orders").select("id,masa,kind,created_at,order_items(id,product_key,name,option,price,qty,status,note,guest_id,paid,created_at)").eq("status", "acik").eq("kind", "masa");
  $("offline").classList.toggle("on", !!error);
  if(error) return;
  openOrders = data.map(o => ({...o, items:(o.order_items || []).sort((a, b) => a.created_at.localeCompare(b.created_at))}));
  const pend = new Set(openOrders.flatMap(o => pendingOf(o).map(i => i.id)));
  if(knownPending){
    const fresh = openOrders.filter(o => pendingOf(o).some(i => !knownPending.has(i.id)));
    if(fresh.length){ ding(); toast(fresh.map(o => `Masa ${o.masa}`).join(", ") + ": yeni sipariş onay bekliyor"); }
  }
  knownPending = pend;
  const rdy = new Set(openOrders.flatMap(o => readyOf(o).map(i => i.id)));
  if(knownReady){
    const fresh = openOrders.filter(o => readyOf(o).some(i => !knownReady.has(i.id)));
    if(fresh.length){ ding(); toast(fresh.map(o => `Masa ${o.masa}`).join(", ") + ": sipariş hazır"); }
  }
  knownReady = rdy;
  renderMasalar(); updateHint(); updateBar();
  if(wrap.classList.contains("open")) renderSheet();
}
let rt;
const soon = () => { clearTimeout(rt); rt = setTimeout(refresh, 200); };
function live(){
  if(!db){ $("offline").classList.add("on"); return; }
  db.channel("garson")
    .on("postgres_changes", {event:"*", schema:"public", table:"orders"}, soon)
    .on("postgres_changes", {event:"*", schema:"public", table:"order_items"}, soon)
    .subscribe(s => { const ok = s === "SUBSCRIBED"; $("live").classList.toggle("ok", ok); $("live").textContent = ok ? "Canlı" : "Bağlanıyor"; });
}

selectMasa(masa);
loadPrices().then(() => { view.render(); updateBar(); });
watchPrices(() => { view.render(); updateBar(); });
refresh(); live();
setInterval(refresh, 20000);   // canlı bağlantı koparsa yedek yenileme
</script>
</body>
</html>
