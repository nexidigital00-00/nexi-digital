<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12443f">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ortak/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ortak/menu.js"></script>
<title>ZLD | Mutfak ve kasa</title>
<meta name="robots" content="noindex">
</head>
<body>
<div class="staff-top">
  <img src="logo.png" alt="" width="38" height="38">
  <h1>Mutfak ve kasa</h1>
  <span class="live" id="live">Bağlanıyor</span>
  <a href="garson.html">Garson</a>
</div>
<p class="offline" id="offline">Sunucuya bağlanılamadı. İnternet bağlantısını kontrol edin.</p>
<div class="filters">
  <button type="button" data-f="hepsi" aria-pressed="true">Hepsi</button>
  <button type="button" data-f="masa" aria-pressed="false">Masalar</button>
  <button type="button" data-f="online" aria-pressed="false">Gel Al</button>
  <button type="button" id="sound" aria-pressed="false">Sesli uyarıyı aç</button>
  <span class="daysum" id="daysum"></span>
</div>
<section class="board" id="board" aria-live="polite"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const NEXT = {yeni:["hazirlaniyor","Hazırlanıyor"], hazirlaniyor:["hazir","Hazır"], hazir:["servis","Teslim edildi"]};
const STATUS_TR = {yeni:"Yeni", hazirlaniyor:"Hazırlanıyor", hazir:"Hazır", servis:"Teslim edildi"};
let orders = [], filter = "hepsi", soundOn = false, known = null;
const ago = iso => { const m = Math.floor((Date.now() - new Date(iso)) / 60000); return m < 1 ? "şimdi" : m < 60 ? m + " dk önce" : Math.floor(m / 60) + " sa " + (m % 60) + " dk önce"; };
const clock = iso => new Date(iso).toLocaleTimeString("tr-TR", {hour:"2-digit", minute:"2-digit"});

function beep(){
  if(!soundOn) return;
  try{ const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.25, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .6);
    o.start(); o.stop(c.currentTime + .6); }catch(e){}
}
function render(fresh = new Set()){
  // Masalar geliş sırasına, Gel Al siparişleri alış saatine göre
  const list = orders.filter(o => filter === "hepsi" || o.kind === filter).sort((a, b) => {
    const ka = a.kind === "online" ? (a.pickup_time || "") : a.created_at.slice(0, 10) + " " + a.created_at.slice(11, 16);
    const kb = b.kind === "online" ? (b.pickup_time || "") : b.created_at.slice(0, 10) + " " + b.created_at.slice(11, 16);
    return ka.localeCompare(kb);
  });
  $("board").innerHTML = list.length ? list.map(o => {
    const total = o.items.reduce((a, i) => a + i.price * i.qty, 0);
    const due = o.items.filter(i => !i.paid).reduce((a, i) => a + i.price * i.qty, 0);
    // masada kişi kişi hesap (QR'dan sipariş verenler ayrı ödeyebilir)
    const groups = {}, lab = makeLabeler(o.masa, o.allItems || o.items);
    if(o.kind === "masa") o.items.forEach(i => {
      const k = i.guest_id || "garson";
      (groups[k] = groups[k] || {name: lab(i), ids: [], sum: 0, unpaid: 0}).ids.push(i.id);
      groups[k].sum += i.price * i.qty; if(!i.paid) groups[k].unpaid += i.price * i.qty;
    });
    // kodlar sırayla (1A, 1B…), masa geneli en sonda
    const G = Object.entries(groups).sort(([a, x], [b, y]) => a === "garson" ? 1 : b === "garson" ? -1 : x.name.localeCompare(y.name, "tr", {numeric:true})).map(([, g]) => g);
    const title = o.kind === "masa" ? `Masa ${o.masa}` : `Gel Al`;
    let tag = "";
    if(o.kind === "online"){
      const p = parseSlot(o.pickup_time), now = Date.now();
      const cls = !p ? "" : (p.start - now < 3600000 && p.end > now) ? "soon" : (p.start - now > 6 * 3600000) ? "later" : "";
      tag = `<span class="pickup-tag ${cls}">Alış: ${esc(slotLabel(o.pickup_time))}${cls === "soon" ? ", yaklaşıyor" : ""}</span>`;
    }
    return `<article class="ticket ${o.kind === "online" ? "online" : ""} ${fresh.has(o.id) ? "flash" : ""}" data-o="${o.id}">
      <header><b>${title}</b><span>Sipariş ${clock(o.created_at)}, ${ago(o.created_at)}</span></header>${tag}
      ${o.kind === "online" ? `<div class="who">${esc(o.customer_name || "")} ${o.customer_phone ? `<a href="tel:+90${esc(o.customer_phone.replace(/^90|^0/, ""))}">${esc(o.customer_phone)}</a>` : ""}${o.note ? `<br>Not: ${esc(o.note)}` : ""}</div>` : ""}
      <ul>${o.items.map(i => `<li class="${i.status}">
        <span class="q">${i.qty}×</span>
        <span class="t">${esc(itemLabel(i.name, i.option))}${i.note ? `<small>${esc(i.note)}</small>` : ""}<small>${STATUS_TR[i.status]}${o.kind === "masa" ? ", " + esc(makeLabeler(o.masa, o.allItems || o.items)(i)) : ""}</small></span>
        ${NEXT[i.status] ? `<button type="button" data-i="${i.id}" data-s="${NEXT[i.status][0]}">${NEXT[i.status][1]}</button>` : ""}
      </li>`).join("") || `<li><span class="t">Henüz ürün yok</span></li>`}</ul>
      ${G.length > 1 ? `<div class="split"><h4>Kişi kişi hesap</h4>${G.map(g => `<div class="srow ${g.unpaid ? "" : "paid"}">
        <span>${esc(g.name)}</span><b>${tl(g.sum)}</b>
        ${g.unpaid ? `<button type="button" data-pay="${g.ids.join(",")}" data-name="${esc(g.name)}" data-sum="${g.unpaid}">Ödendi</button>` : `<em>Ödendi</em>`}
      </div>`).join("")}</div>` : ""}
      <footer><strong>${due !== total ? `Kalan ${tl(due)}` : tl(total)}</strong>
        <button class="btn" type="button" data-close="${o.id}" data-total="${due}" data-title="${title}" data-kind="${o.kind}">${o.kind === "online" ? "Teslim edildi" : "Hesabı kapat"}</button></footer>
    </article>`;
  }).join("") : `<p class="board-empty">Açık sipariş yok. Garson sipariş gönderdiğinde ya da Gel Al siparişi geldiğinde burada görünür.</p>`;
}
$("board").addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.i){
    b.disabled = true;
    const {error} = await db.from("order_items").update({status:b.dataset.s}).eq("id", b.dataset.i);
    if(error){ toast("Kaydedilemedi, tekrar deneyin"); b.disabled = false; }
  }
  if(b.dataset.pay){
    if(!confirm(`${b.dataset.name}: ${tl(+b.dataset.sum)} ödendi mi?`)) return;
    b.disabled = true;
    const {error} = await db.from("order_items").update({paid:true}).in("id", b.dataset.pay.split(","));
    if(error){ toast("Kaydedilemedi, tekrar deneyin"); b.disabled = false; return; }
    toast(`${b.dataset.name} ödedi`);
  }
  if(b.dataset.close){
    const q = b.dataset.kind === "online"
      ? `Gel Al siparişi ${tl(+b.dataset.total)}. Müşteri teslim aldı ve ödedi mi?`
      : `${b.dataset.title} hesabı ${tl(+b.dataset.total)}. Ödeme alındı mı? Hesap kapatılsın mı?`;
    if(!confirm(q)) return;
    b.disabled = true;
    const {error} = await db.from("orders").update({status:"kapandi", closed_at:new Date().toISOString()}).eq("id", b.dataset.close);
    if(error){ toast("Hesap kapatılamadı, tekrar deneyin"); b.disabled = false; return; }
    toast(b.dataset.kind === "online" ? "Gel Al siparişi teslim edildi" : `${b.dataset.title} hesabı kapatıldı`);
  }
});
document.querySelector(".filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.id === "sound"){ soundOn = !soundOn; b.setAttribute("aria-pressed", soundOn); b.textContent = soundOn ? "Sesli uyarı açık" : "Sesli uyarıyı aç"; if(soundOn) beep(); return; }
  filter = b.dataset.f;
  document.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});

async function refresh(){
  if(!db){ $("offline").classList.add("on"); return; }
  const {data, error} = await db.from("orders").select("id,kind,masa,customer_name,customer_phone,pickup_time,note,created_at,order_items(id,name,option,price,qty,status,note,guest_id,guest_name,paid,created_at)").eq("status", "acik").order("created_at");
  $("offline").classList.toggle("on", !!error);
  if(error) return;
  // garsonun henüz onaylamadığı QR siparişleri mutfakta görünmez
  orders = data.map(o => ({...o, allItems:o.order_items || [], items:(o.order_items || []).filter(i => i.status !== "onay").sort((a, b) => a.created_at.localeCompare(b.created_at))}))
    .filter(o => o.items.length || !(o.order_items || []).length);
  const ids = new Set(orders.flatMap(o => o.items.map(i => i.id)));
  const fresh = new Set();
  if(known){ orders.forEach(o => { if(o.items.some(i => !known.has(i.id))) fresh.add(o.id); }); if(fresh.size) beep(); }
  known = ids;
  render(fresh);
  daySum();
}
async function daySum(){
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const {data, error} = await db.from("orders").select("order_items(price,qty)").eq("status", "kapandi").gte("closed_at", start.toISOString());
  if(error) return;
  const t = data.reduce((a, o) => a + o.order_items.reduce((x, i) => x + i.price * i.qty, 0), 0);
  $("daysum").innerHTML = `Bugün kapanan: ${data.length} hesap, <b>${tl(t)}</b>`;
}
let timer;
const soon = () => { clearTimeout(timer); timer = setTimeout(refresh, 150); };
if(db) db.channel("mutfak")
  .on("postgres_changes", {event:"*", schema:"public", table:"orders"}, soon)
  .on("postgres_changes", {event:"*", schema:"public", table:"order_items"}, soon)
  .subscribe(s => { const ok = s === "SUBSCRIBED"; $("live").classList.toggle("ok", ok); $("live").textContent = ok ? "Canlı" : "Bağlanıyor"; });
setInterval(() => render(), 30000);
setInterval(refresh, 20000);   // canlı bağlantı koparsa yedek yenileme
refresh();
</script>
</body>
</html>
