<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12443f">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ortak/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ortak/menu.js"></script>
<title>ZLD | Mutfak ve kasa</title>
<meta name="robots" content="noindex">
</head>
<body>
<div class="staff-top">
  <img src="logo.png" alt="" width="38" height="38">
  <h1>Mutfak ve kasa</h1>
  <span class="live" id="live">Bağlanıyor</span>
  <a href="garson.html">Garson</a>
</div>
<p class="offline" id="offline">Sunucuya bağlanılamadı. İnternet bağlantısını kontrol edin.</p>
<div class="filters">
  <button type="button" data-f="hepsi" aria-pressed="true">Hepsi</button>
  <button type="button" data-f="masa" aria-pressed="false">Masalar</button>
  <button type="button" data-f="online" aria-pressed="false">Paket siparişler</button>
  <button type="button" id="sound" aria-pressed="false">Sesli uyarıyı aç</button>
  <span class="daysum" id="daysum"></span>
</div>
<section class="board" id="board" aria-live="polite"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const NEXT = {yeni:["hazirlaniyor","Hazırlanıyor"], hazirlaniyor:["hazir","Hazır"], hazir:["servis","Teslim edildi"]};
const STATUS_TR = {yeni:"Yeni", hazirlaniyor:"Hazırlanıyor", hazir:"Hazır", servis:"Teslim edildi"};
let orders = [], filter = "hepsi", soundOn = false, known = null;
const ago = iso => { const m = Math.floor((Date.now() - new Date(iso)) / 60000); return m < 1 ? "şimdi" : m < 60 ? m + " dk önce" : Math.floor(m / 60) + " sa " + (m % 60) + " dk önce"; };
const clock = iso => new Date(iso).toLocaleTimeString("tr-TR", {hour:"2-digit", minute:"2-digit"});

function beep(){
  if(!soundOn) return;
  try{ const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.25, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .6);
    o.start(); o.stop(c.currentTime + .6); }catch(e){}
}
function render(fresh = new Set()){
  const list = orders.filter(o => filter === "hepsi" || o.kind === filter);
  $("board").innerHTML = list.length ? list.map(o => {
    const total = o.items.reduce((a, i) => a + i.price * i.qty, 0);
    const title = o.kind === "masa" ? `Masa ${o.masa}` : `Paket`;
    return `<article class="ticket ${o.kind === "online" ? "online" : ""} ${fresh.has(o.id) ? "flash" : ""}" data-o="${o.id}">
      <header><b>${title}</b><span>${clock(o.created_at)}, ${ago(o.created_at)}</span></header>
      ${o.kind === "online" ? `<div class="who">${esc(o.customer_name || "")} ${o.customer_phone ? `<a href="tel:+90${esc(o.customer_phone.replace(/^90|^0/, ""))}">${esc(o.customer_phone)}</a>` : ""}${o.pickup_time ? `<br>Teslim: <b>${esc(o.pickup_time)}</b>` : ""}${o.note ? `<br>Not: ${esc(o.note)}` : ""}</div>` : ""}
      <ul>${o.items.map(i => `<li class="${i.status}">
        <span class="q">${i.qty}×</span>
        <span class="t">${esc(itemLabel(i.name, i.option))}${i.note ? `<small>${esc(i.note)}</small>` : ""}<small>${STATUS_TR[i.status]}</small></span>
        ${NEXT[i.status] ? `<button type="button" data-i="${i.id}" data-s="${NEXT[i.status][0]}">${NEXT[i.status][1]}</button>` : ""}
      </li>`).join("") || `<li><span class="t">Henüz ürün yok</span></li>`}</ul>
      <footer><strong>${tl(total)}</strong>
        <button class="btn" type="button" data-close="${o.id}" data-total="${total}" data-title="${title}">Hesabı kapat</button></footer>
    </article>`;
  }).join("") : `<p class="board-empty">Açık sipariş yok. Garson sipariş gönderdiğinde ya da paket sipariş geldiğinde burada görünür.</p>`;
}
$("board").addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.i){
    b.disabled = true;
    const {error} = await db.from("order_items").update({status:b.dataset.s}).eq("id", b.dataset.i);
    if(error){ toast("Kaydedilemedi, tekrar deneyin"); b.disabled = false; }
  }
  if(b.dataset.close){
    if(!confirm(`${b.dataset.title} hesabı ${tl(+b.dataset.total)}. Ödeme alındı mı? Hesap kapatılsın mı?`)) return;
    b.disabled = true;
    const {error} = await db.from("orders").update({status:"kapandi", closed_at:new Date().toISOString()}).eq("id", b.dataset.close);
    if(error){ toast("Hesap kapatılamadı, tekrar deneyin"); b.disabled = false; return; }
    toast(`${b.dataset.title} hesabı kapatıldı`);
  }
});
document.querySelector(".filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.id === "sound"){ soundOn = !soundOn; b.setAttribute("aria-pressed", soundOn); b.textContent = soundOn ? "Sesli uyarı açık" : "Sesli uyarıyı aç"; if(soundOn) beep(); return; }
  filter = b.dataset.f;
  document.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});

async function refresh(){
  if(!db){ $("offline").classList.add("on"); return; }
  const {data, error} = await db.from("orders").select("id,kind,masa,customer_name,customer_phone,pickup_time,note,created_at,order_items(id,name,option,price,qty,status,note,created_at)").eq("status", "acik").order("created_at");
  $("offline").classList.toggle("on", !!error);
  if(error) return;
  orders = data.map(o => ({...o, items:(o.order_items || []).sort((a, b) => a.created_at.localeCompare(b.created_at))}));
  const ids = new Set(orders.flatMap(o => o.items.map(i => i.id)));
  const fresh = new Set();
  if(known){ orders.forEach(o => { if(o.items.some(i => !known.has(i.id))) fresh.add(o.id); }); if(fresh.size) beep(); }
  known = ids;
  render(fresh);
  daySum();
}
async function daySum(){
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const {data, error} = await db.from("orders").select("order_items(price,qty)").eq("status", "kapandi").gte("closed_at", start.toISOString());
  if(error) return;
  const t = data.reduce((a, o) => a + o.order_items.reduce((x, i) => x + i.price * i.qty, 0), 0);
  $("daysum").innerHTML = `Bugün kapanan: ${data.length} hesap, <b>${tl(t)}</b>`;
}
let timer;
const soon = () => { clearTimeout(timer); timer = setTimeout(refresh, 150); };
if(db) db.channel("mutfak")
  .on("postgres_changes", {event:"*", schema:"public", table:"orders"}, soon)
  .on("postgres_changes", {event:"*", schema:"public", table:"order_items"}, soon)
  .subscribe(s => { const ok = s === "SUBSCRIBED"; $("live").classList.toggle("ok", ok); $("live").textContent = ok ? "Canlı" : "Bağlanıyor"; });
setInterval(() => render(), 30000);
setInterval(refresh, 20000);   // canlı bağlantı koparsa yedek yenileme
refresh();
</script>
</body>
</html>
